
model_name: "Qwen/Qwen3-0.6B"
output_dir: "results/devmate-lora"

# CPU-friendly initial experiment
torch_dtype: "float32"
use_cpu: true

# LoRA adapter settings
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"

# Training settings
num_train_epochs: 2
learning_rate: 0.0001
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
max_length: 256
logging_steps: 1
